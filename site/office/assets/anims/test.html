<!doctype html><meta charset=utf-8><title>EWS anim test</title>
<style>body{margin:0;background:#1b1d22;color:#ddd;font:13px system-ui}#ui{position:fixed;left:8px;top:8px;background:#0008;padding:8px;border-radius:6px}</style>
<div id=ui><select id=sel></select> <span id=out></span></div>
<script type=module>
import * as THREE from '../../vendor/three.module.min.js?v=169';
import { GLTFLoader } from '../../vendor/jsm/loaders/GLTFLoader.js?v=169';
import { DRACOLoader } from '../../vendor/jsm/loaders/DRACOLoader.js?v=169';
import { MeshoptDecoder } from '../../vendor/jsm/libs/meshopt_decoder.module.js?v=169';
const q=new URLSearchParams(location.search), packs=(q.get('packs')||'desk_core').split(',');
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); R.setSize(innerWidth,innerHeight); document.body.appendChild(R.domElement);
const S=new THREE.Scene(); S.background=new THREE.Color(0x2a2d34); S.add(new THREE.HemisphereLight(0xffffff,0x444455,2.2)); const dl=new THREE.DirectionalLight(0xffffff,1.5); dl.position.set(2,4,3); S.add(dl);
const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.05,50); const view=(q.get('view')||'34').split(''); 
const L=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).setDRACOLoader(new DRACOLoader().setDecoderPath('/office/vendor/draco/'));
const [man,...pk]=await Promise.all(['../../modules/base-avatar/assets/human_Male.glb',...packs.map(p=>p+'.glb')].map(f=>L.loadAsync(f)));
const A=await (await fetch('anchors.json')).json();
const b2t=v=>new THREE.Vector3(v[0],v[2],-v[1]);   // Blender clip frame -> three (+z forward)
const body=man.scene; S.add(body); const clips=pk.flatMap(g=>g.animations);
const B={}, REST={}; body.traverse(o=>{if(o.isBone){B[o.name]=o; REST[o.name]=o.quaternion.clone();} if(o.isMesh)o.frustumCulled=false;});
// desk kit props at the anchors (same sizes as core/kit.js)
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.6}); const box=(w,h,d,c,p)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.copy(p);S.add(m);return m};
const [inp]=await Promise.all([L.loadAsync('desk_input.glb')]); const KB=inp.scene.getObjectByName('Keyboard'), MO=inp.scene.getObjectByName('Mouse');
const kc=b2t(A.keyboard.centre_base), mc=b2t(A.mouse.centre_base);
box(1.4,0.04,0.7,0x8a6a48,new THREE.Vector3(0,0.74,kc.z+0.12));
const kg=new THREE.Group(); kg.position.set(kc.x,kc.y+0.008,kc.z); kg.rotation.y=+(q.get("kyaw")??Math.PI); S.add(kg); KB.position.set(0,0,0); kg.add(KB);   // KB node carries its own 6 deg tilt
MO.position.set(0,0,0); MO.rotation.y=+(q.get("kyaw")??Math.PI); MO.position.copy(mc); S.add(MO);
const mk=c=>{const m=new THREE.Mesh(new THREE.SphereGeometry(0.012),new THREE.MeshBasicMaterial({color:c,depthTest:false}));m.renderOrder=9;S.add(m);return m}; const dots={l:mk(0x40ff80),r:mk(0x40c0ff)};
const mixer=new THREE.AnimationMixer(body); let cur;
for(const c of clips){const o=document.createElement('option');o.textContent=c.name;sel.appendChild(o)}
function play(n){ if(cur)cur.stop(); cur=mixer.clipAction(clips.find(c=>c.name==n)); cur.play(); }
sel.onchange=()=>play(sel.value);
const tgt=new THREE.Vector3(-0.1,0.8,0.15); cam.position.set(...(view.join('')=='side'?[-1.3,1.0,0.25]:view.join('')=='top'?[-0.15,1.75,0.55]:view.join('')=='close'?[-0.45,1.05,0.65]:[0.9,1.35,1.4])); cam.lookAt(tgt);
// anchor target at time t (mirrors build.py curves; contact = middle_01 head)
function anchorAt(clip,s,t){ const sm=A.samples[clip][s], n=sm.length-1, i=Math.min(n,Math.round(t*A.frames/A.samples_every)); return b2t(sm[i].slice(3)); }
const w=new THREE.Vector3();
window.gate=()=>{ const res={};
  for(const c of clips){ if(!A.samples[c.name]&&!q.get('all'))continue; play(c.name); const a=cur; let worst=0, bindish=0, n=0; const sides=A.clips[c.name]||{};
    for(let i=0;i<=A.frames/A.samples_every;i++){ const t=i*A.samples_every/A.frames; a.time=t*c.duration; mixer.update(0); body.updateMatrixWorld(true);
      for(const s in sides){ B['middle_04_leaf_'+s].getWorldPosition(w); worst=Math.max(worst,w.distanceTo(anchorAt(c.name,s,t))); }
      // bind-pose check: upper arms must be well away from rest (T/A pose = arms out)
      // bind pose = arms + legs all within 8 deg of the rest (bind) pose
      const near=k=>B[k].quaternion.angleTo(REST[k])<0.14; if(['upperarm_l','upperarm_r','lowerarm_l','lowerarm_r','thigh_l','thigh_r'].every(near)) bindish++; n++; }
    res[c.name]={contact_cm:+(worst*100).toFixed(2), bind_frames:bindish, pass: worst<0.05 && bindish===0}; }
  play(sel.value||clips[0].name); return res; };
const clk=new THREE.Clock(); play(q.get('clip')||clips[0].name); sel.value=cur._clip.name;
if(q.get('t')){cur.time=+q.get('t')*cur._clip.duration; cur.paused=true;}
(function loop(){ requestAnimationFrame(loop); mixer.update(clk.getDelta()); body.updateMatrixWorld(true);
  const n=cur._clip.name, t=(cur.time%cur._clip.duration)/cur._clip.duration, sd=A.clips[n]||{};
  for(const s of ['l','r']){dots[s].visible=!!sd[s]; if(sd[s]) dots[s].position.copy(anchorAt(n,s,t));}
  R.render(S,cam); })();
window.ready=true;
</script>
