name: Elderverse Xbox package

on:
  push:
    branches:
      - "agent/**"
    tags:
      - "xbox-ev-v*"
    paths:
      - "xbox/elderverse-shell/**"
  workflow_dispatch:
    inputs:
      store:
        description: Build an unsigned StoreUpload package as a second artifact
        type: boolean
        required: false
        default: false

concurrency:
  group: xbox-elderverse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    name: Build and test-sign x64 package
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha7: ${{ steps.meta.outputs.sha7 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set package version
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/xbox-ev-v(\d+\.\d+\.\d+)$') {
            $version = "$($Matches[1]).0"
          } else {
            $version = "0.1.$env:GITHUB_RUN_NUMBER.0"
          }
          $manifestPath = "xbox/elderverse-shell/ElderverseShell/Package.appxmanifest"
          [xml]$manifest = Get-Content -Raw $manifestPath
          $identity = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
          if ($null -eq $identity) { throw "Package Identity is missing from $manifestPath" }
          $identity.SetAttribute('Version', $version)
          $manifest.Save((Resolve-Path $manifestPath))
          $sha7 = (git rev-parse --short=7 $env:GITHUB_SHA).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha7=$sha7" >> $env:GITHUB_OUTPUT

      - name: Create ephemeral test signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Elder World Studio Inc" `
            -FriendlyName "Elderverse CI test signing" `
            -KeyUsage DigitalSignature `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $pfxPath = Join-Path $env:RUNNER_TEMP "Elderverse-CI.ephemeral.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "Elderverse-CI.cer"
          $passwordText = [Guid]::NewGuid().ToString("N")
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          "PACKAGE_CERT_PASSWORD=$passwordText" >> $env:GITHUB_ENV

      - name: Restore and build Release x64 bundle
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "elderverse-msbuild-package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          msbuild "xbox/elderverse-shell/ElderverseShell.sln" `
            /m /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageFormat=Msix `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            "/p:PackageCertificateKeyFile=$env:RUNNER_TEMP\Elderverse-CI.ephemeral.pfx" `
            "/p:PackageCertificatePassword=$env:PACKAGE_CERT_PASSWORD" `
            "/p:AppxPackageDir=$packageDir\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare installer-compatible artifact
        id: stage
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "elderverse-msbuild-package"
          $stage = Join-Path $env:RUNNER_TEMP "elderverse-test-build"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $bundles = @(Get-ChildItem -Path $packageDir -Filter "*.msixbundle" -File -Recurse)
          if ($bundles.Count -ne 1) { throw "Expected one .msixbundle, found $($bundles.Count)." }
          Copy-Item $bundles[0].FullName (Join-Path $stage $bundles[0].Name)

          $dependencyFiles = @(Get-ChildItem -Path $packageDir -Filter "*.appx" -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]Dependencies[\\/]x64[\\/]' })
          if ($dependencyFiles.Count -eq 0) { throw "No x64 framework dependency .appx files were produced." }
          $dependencyDir = Join-Path $stage "Dependencies/x64"
          New-Item -ItemType Directory -Force -Path $dependencyDir | Out-Null
          foreach ($dependency in $dependencyFiles) {
            Copy-Item $dependency.FullName (Join-Path $dependencyDir $dependency.Name)
          }
          Copy-Item (Join-Path $env:RUNNER_TEMP "Elderverse-CI.cer") (Join-Path $stage "Elderverse-CI.cer")

          $build = [ordered]@{
            version = "${{ steps.meta.outputs.version }}"
            sha = "${{ github.sha }}"
            ref = "${{ github.ref }}"
            run_id = "${{ github.run_id }}"
          }
          $build | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $stage "build.json")
          $sumLines = @()
          Get-ChildItem -Path $stage -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($stage, $_.FullName).Replace('\', '/')
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            $sumLines += "$hash  $relative"
          }
          $sumLines | Set-Content -Encoding ascii (Join-Path $stage "SHA256SUMS")
          $releaseZip = Join-Path $env:RUNNER_TEMP "elderverse-xbox-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha7 }}-build.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $releaseZip -CompressionLevel Optimal
          "stage=$stage" >> $env:GITHUB_OUTPUT
          "releaseZip=$releaseZip" >> $env:GITHUB_OUTPUT

      - name: Upload test package artifact
        uses: actions/upload-artifact@v4
        with:
          name: elderverse-xbox-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha7 }}-build
          path: ${{ steps.stage.outputs.stage }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Attach test package to tag prerelease
        if: startsWith(github.ref, 'refs/tags/xbox-ev-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          draft: false
          generate_release_notes: false
          files: ${{ steps.stage.outputs.releaseZip }}

  store-upload:
    name: Build unsigned StoreUpload package
    if: startsWith(github.ref, 'refs/tags/xbox-ev-v') || github.event.inputs.store == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set package version
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/xbox-ev-v(\d+\.\d+\.\d+)$') {
            $version = "$($Matches[1]).0"
          } else {
            $version = "0.1.$env:GITHUB_RUN_NUMBER.0"
          }
          $manifestPath = "xbox/elderverse-shell/ElderverseShell/Package.appxmanifest"
          [xml]$manifest = Get-Content -Raw $manifestPath
          $identity = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
          if ($null -eq $identity) { throw "Package Identity is missing from $manifestPath" }
          $identity.SetAttribute('Version', $version)
          $manifest.Save((Resolve-Path $manifestPath))
          $sha7 = (git rev-parse --short=7 $env:GITHUB_SHA).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha7=$sha7" >> $env:GITHUB_OUTPUT

      - name: Restore and build unsigned StoreUpload package
        id: store
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "elderverse-store-package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          msbuild "xbox/elderverse-shell/ElderverseShell.sln" `
            /m /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageFormat=Msix `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageSigningEnabled=false `
            "/p:AppxPackageDir=$packageDir\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uploads = @(Get-ChildItem -Path $packageDir -Filter "*.msixupload" -File -Recurse)
          if ($uploads.Count -ne 1) { throw "Expected one unsigned .msixupload, found $($uploads.Count)." }
          "storeUpload=$($uploads[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned StoreUpload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elderverse-xbox-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha7 }}-storeupload
          path: ${{ steps.store.outputs.storeUpload }}
          if-no-files-found: error
          retention-days: 30
